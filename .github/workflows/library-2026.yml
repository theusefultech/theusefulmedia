name: Publish Books that defined 2026

# Season Plan L3 (Raja "A", 24 Nov 2026): /library/2026/ goes live by itself on 1 Dec 2026, 6:01 AM IST.
# The script refuses to write before 1 Dec IST, so a manual run earlier does nothing.
on:
  schedule:
    - cron: "31 0 1 12 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-issues
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_books2026.py
      - run: python3 scripts/build_sitemap.py
      - name: Commit
        run: |
          git config user.name "useful-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add library/2026 sitemap.xml
          if git diff --staged --quiet; then echo "Nothing to publish"; else
            git commit -m "Library: publish Books that defined 2026"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
          fi

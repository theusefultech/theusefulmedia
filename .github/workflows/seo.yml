name: SEO pass and IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "sitemap.xml"
  workflow_run:
    workflows: ["Build newsletter library"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structured data and alt text
        run: python3 scripts/seo_pass.py
      - name: Commit SEO fixes
        run: |
          git config user.name "useful-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --staged --quiet; then echo "No SEO changes"; else git commit -m "SEO pass" && git push; fi
      - name: Wait for GitHub Pages to deploy
        run: sleep 90
      - name: Ping IndexNow with changed pages
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git fetch -q origin main && python3 scripts/indexnow.py HEAD~3..HEAD || true
          else
            python3 scripts/indexnow.py "$BEFORE..HEAD"
          fi

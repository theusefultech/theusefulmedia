name: Build newsletter library

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_library.py"
      - ".github/workflows/build-issues.yml"

permissions:
  contents: write

concurrency:
  group: build-issues
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4==4.12.3 lxml
      - run: python3 scripts/build_library.py
      - name: Commit changes
        run: |
          git config user.name "useful-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tech/library tech/issues
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update newsletter library"
            git push
          fi

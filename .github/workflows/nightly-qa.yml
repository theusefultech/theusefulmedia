# 27 Nov 2026 (Raja, plan A layer 4): every night, every page in tools/qa/pages.txt (both sites) at 375, 393, 430 and
# 1440 px plus dark mode. Free: rules only, no Claude usage, and this repo is public, so no GitHub minutes are billed.
# Emails raja@theusefultech.com (Watchdog /api/alert) only when a problem is new since last night. Screenshots are kept
# for 7 days as the run's artifact.
name: Nightly site check
on:
  schedule:
    - cron: "37 21 * * *"   # 3:07 AM IST
  workflow_dispatch:
concurrency: { group: nightly-qa, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: tools/qa } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: qa-playwright-1.49.1 }
      - run: npm i --no-save playwright@1.49.1 @axe-core/playwright@4.10.1 && npx playwright install --with-deps chromium
      - name: Check every page
        run: node check.mjs pages.txt 6 > run.log 2>&1 || (tail -40 run.log; exit 1)
      - name: Compare with last night and email only new problems
        env: { UPLOAD_KEY: "${{ secrets.UPLOAD_KEY }}" }
        run: python3 nightly.py results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: site-check, path: "tools/qa/shots\ntools/qa/results.json", retention-days: 7 }
      - name: Save tonight's list
        run: |
          git config user.name "useful-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add known.json
          git diff --staged --quiet || (git commit -m "Nightly site check: known problems [skip ci]" && git pull --rebase -q && git push)

name: Mayfly
options:
  bundleIdPrefix: com.theusefulmedia
  deploymentTarget:
    iOS: "26.0"
targets:
  Mayfly:
    type: application
    platform: iOS
    sources: [Mayfly]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theusefulmedia.mayfly
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mayfly
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"

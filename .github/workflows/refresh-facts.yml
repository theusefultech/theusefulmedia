name: Refresh site numbers

# Daily: pulls The Useful Tech's public Medium stats, writes sponsor/facts.json and
# rewrites every follower, post and view count typed into the site. Drops past booked dates.
on:
  schedule:
    - cron: "41 1 * * *"   # 07:11 IST
  workflow_dispatch:
  push:
    paths:
      - "scripts/refresh_facts.py"
      - ".github/workflows/refresh-facts.yml"

permissions:
  contents: write

concurrency:
  group: build-issues
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/refresh_facts.py
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Refresh site numbers"
            git pull --rebase
            git push
          fi
